plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "${moddev_version}" apply false
}

apply from: rootProject.file("gradle/targets.gradle")

def fabricProjectPaths = targets.keySet().collect { ":versions:fabric-${it}" }
def neoForgeProjectPaths = targets.keySet().collect { ":versions:neoforge-${it}" }
def fabricGameTestTasks = fabricProjectPaths.collect { "${it}:runClientGameTest" }

tasks.register("cleanIdeaRunConfigurations", Delete) {
    group = "ide"
    description = "Deletes generated Fabric run configurations before IDEA recreates them."
    delete fileTree(rootProject.file(".idea/runConfigurations")) {
        include "Minecraft_Client.xml"
        include "Minecraft_Server.xml"
        include "Minecraft_Client_Fabric_*fabric-*.xml"
        include "Gametest_Minecraft_Client_Game_Test_*fabric-*.xml"
    }
}

tasks.register("syncIdeaRunConfigurations") {
    group = "ide"
    description = "Recreates IDEA run configurations for every configured Fabric target."
    dependsOn(fabricProjectPaths.collect { "${it}:ideaSyncTask" })
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds every Fabric and NeoForge target."
    dependsOn(fabricProjectPaths.collect { "${it}:build" })
    dependsOn(neoForgeProjectPaths.collect { "${it}:build" })
}

tasks.register("testAll") {
    group = "verification"
    description = "Runs the loader-neutral unit test suite."
    dependsOn(":tests:unit:test")
}

tasks.register("localIntegration") {
    group = "verification"
    description = "Runs graphical Fabric integration tests and NeoForge startup smoke tests locally."
    dependsOn(fabricGameTestTasks)
    dependsOn("localNeoForgeSmoke")
}

gradle.projectsEvaluated {
    fabricGameTestTasks.eachWithIndex { taskPath, index ->
        if (index > 0) {
            tasks.getByPath(taskPath).mustRunAfter(fabricGameTestTasks[index - 1])
        }
    }
    tasks.named("localNeoForgeSmoke") {
        mustRunAfter(fabricGameTestTasks.last())
    }
}

tasks.register("localNeoForgeSmoke", Exec) {
    group = "verification"
    description = "Starts every NeoForge client, verifies bridge discovery, and stops it after startup."
    workingDir rootProject.projectDir
    commandLine(
        "pwsh",
        "-NoProfile",
        "-File",
        rootProject.file("scripts/run-local-neoforge-smoke.ps1").absolutePath
    )
}

// Configure each generated target here; the target directories need no build scripts.
targets.each { minecraft, target ->
    ["fabric", "neoforge"].each { loader ->
        project(":versions:${loader}-${minecraft}") {
            ext.minecraftTarget = minecraft
            if (loader == "fabric") {
                pluginManager.apply(target.remappedFabric
                    ? "net.fabricmc.fabric-loom-remap"
                    : "net.fabricmc.fabric-loom")
            } else {
                pluginManager.apply("java-library")
                pluginManager.apply("net.neoforged.moddev")
            }
            pluginManager.apply("maven-publish")
            apply from: rootProject.file("gradle/${loader}-target.gradle")
        }
    }
}
