name: Xaero Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  verify-published-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify every published Xaero target
        shell: pwsh
        run: ./scripts/verify-xaero-artifacts.ps1
