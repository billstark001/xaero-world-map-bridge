name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to retry (for example, v0.1.1)"
        required: true
        type: string
      publish_modrinth:
        description: "Publish all eight Modrinth versions when credentials are configured"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      publish_modrinth: ${{ steps.metadata.outputs.publish_modrinth }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      WANT_MODRINTH: ${{ github.event_name == 'push' || inputs.publish_modrinth }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate and derive release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$(grep -c '^mod_version=' gradle.properties)" -eq 1
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$RELEASE_TAG" = "v$version"

          first_changelog_version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md \
            | grep -v '^Unreleased$' | head -n 1)"
          test "$first_changelog_version" = "$version"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { section = 1 }
            section && /^## \[/ && index($0, "## [" version "]") != 1 { exit }
            section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

          suffix="${version#*-}"
          if [[ "$version" != *-* ]]; then
            channel=release
            prerelease=false
          elif [[ "${suffix,,}" == *alpha* ]]; then
            channel=alpha
            prerelease=true
          else
            channel=beta
            prerelease=true
          fi

          publish_modrinth=false
          if [[ "$WANT_MODRINTH" == "true" \
                && -n "$MODRINTH_PROJECT_ID" \
                && -n "$MODRINTH_TOKEN" ]]; then
            publish_modrinth=true
          elif [[ "$WANT_MODRINTH" == "true" ]]; then
            if [[ -z "$MODRINTH_PROJECT_ID" ]]; then
              echo '::notice::MODRINTH_PROJECT_ID repository variable is not configured; skipping Modrinth publishing.'
            fi
            if [[ -z "$MODRINTH_TOKEN" ]]; then
              echo '::notice::MODRINTH_TOKEN is not configured; skipping Modrinth publishing.'
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "release_name=Xaero World Map Bridge $RELEASE_TAG"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "publish_modrinth=$publish_modrinth"
          } >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all targets once
        run: ./gradlew buildAll --no-parallel --stacktrace

      - name: Collect and validate distributable JARs
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/release
          mv release-notes.md build/release/
          for minecraft in 1.21.11 26.1.2 26.2 26.3; do
            for loader in fabric neoforge; do
              jar="versions/$loader-$minecraft/build/libs/xaero-world-map-bridge-$VERSION+$minecraft-$loader.jar"
              test -f "$jar"
              cp "$jar" build/release/
            done
          done
          test "$(find build/release -maxdepth 1 -name '*.jar' -type f | wc -l)" -eq 8
          test "$(find versions -path '*/build/libs/xaero-world-map-bridge-*.jar' \
            -type f ! -name '*-sources.jar' | wc -l)" -eq 8

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish-github:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: build/release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.release_name }}
          body_path: build/release/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: build/release/*.jar
          fail_on_unmatched_files: true

  publish-modrinth:
    needs: build
    if: ${{ needs.build.outputs.publish_modrinth == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            game_versions: "1.21.11"
            loader: fabric
            dependencies: |-
              fabric-api(required)
              xaeros-world-map(required)
          - minecraft: "1.21.11"
            game_versions: "1.21.11"
            loader: neoforge
            dependencies: "xaeros-world-map(required)"
          - minecraft: "26.1.2"
            game_versions: "26.1.2"
            loader: fabric
            dependencies: |-
              fabric-api(required)
              xaeros-world-map(required)
          - minecraft: "26.1.2"
            game_versions: "26.1.2"
            loader: neoforge
            dependencies: "xaeros-world-map(required)"
          - minecraft: "26.2"
            game_versions: "26.2"
            loader: fabric
            dependencies: |-
              fabric-api(required)
              xaeros-world-map(required)
          - minecraft: "26.2"
            game_versions: "26.2"
            loader: neoforge
            dependencies: "xaeros-world-map(required)"
          - minecraft: "26.3"
            game_versions: "26.3"
            loader: fabric
            dependencies: |-
              fabric-api(required)
              xaeros-world-map(required)
          - minecraft: "26.3"
            game_versions: "26.3"
            loader: neoforge
            dependencies: "xaeros-world-map(required)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: build/release

      - name: Publish Minecraft ${{ matrix.minecraft }} ${{ matrix.loader }} to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/xaero-world-map-bridge-${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-${{ matrix.loader }}.jar
          name: ${{ needs.build.outputs.release_name }} for Minecraft ${{ matrix.minecraft }} (${{ matrix.loader }})
          version: ${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-${{ matrix.loader }}
          version-type: ${{ needs.build.outputs.channel }}
          changelog-file: build/release/release-notes.md
          game-versions: ${{ matrix.game_versions }}
          game-version-filter: none
          loaders: ${{ matrix.loader }}
          environment: client
          dependencies: ${{ matrix.dependencies }}
