def target = rootProject.ext.targets[project.ext.minecraftTarget]

group = rootProject.mod_group
version = "${rootProject.mod_version}+${target.minecraft}-fabric"

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

configurations {
    xaeroBundle {
        canBeConsumed = false
        canBeResolved = true
    }
}

def sharedJavaSources = [
    rootProject.file("src/main/java"),
    rootProject.file("versions/shared-mc-${target.minecraft}/src/main/java"),
    rootProject.file("versions/fabric-common/src/main/java"),
    project.file("src/main/java")
]
if (target.modernRenderer) {
    sharedJavaSources.add(1, rootProject.file("versions/shared-modern/src/main/java"))
}

sourceSets {
    main {
        java.srcDirs = sharedJavaSources
        resources.srcDirs = [rootProject.file("src/main/resources")]
    }
}

loom {
    mods {
        "xaero_world_map_bridge" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            configName = "Minecraft Client Fabric ${target.minecraft}"
            getGenerateRunConfig().set(true)
            runDir = rootProject.file("run").absolutePath
        }
    }
}

// Loom's IDEA application template does not select a JRE. Bind each generated
// configuration to the Java version required by its Minecraft target.
tasks.named("ideaSyncTask").configure {
    dependsOn(rootProject.tasks.named("cleanIdeaRunConfigurations"))
    doLast {
        def moduleMarkers = [
            "<module name=\"${rootProject.name}.versions.fabric-${target.minecraft}.main\"",
            "<module name=\"${rootProject.name}.versions.fabric-${target.minecraft}.gametest\""
        ]
        def runConfigurationsDirectory = rootProject.file(".idea/runConfigurations")
        if (!runConfigurationsDirectory.isDirectory()) return

        fileTree(runConfigurationsDirectory) {
            include "Minecraft_Client_Fabric_*fabric-${target.minecraft}.xml"
            include "Gametest_Minecraft_Client_Game_Test_*fabric-${target.minecraft}.xml"
        }.files.each { runConfigurationFile ->
            def lines = runConfigurationFile.readLines("UTF-8").findAll {
                !it.contains('name="ALTERNATIVE_JRE_PATH"') &&
                    !it.contains('name="ALTERNATIVE_JRE_PATH_ENABLED"')
            }
            if (!lines.any { line -> moduleMarkers.any { line.contains(it) } }) return

            def configurationLine = lines.findIndexOf { it.contains("<configuration ") }
            if (configurationLine < 0) {
                throw new GradleException("Invalid IDEA run configuration: ${runConfigurationFile}")
            }
            lines.add(configurationLine + 1,
                "    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />")
            lines.add(configurationLine + 1,
                "    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${target.javaVersion}\" />")
            runConfigurationFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "xaero_world_map_bridge_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets.named("gametest") {
    java.srcDirs = [rootProject.file("versions/fabric-gametest/src/gametest/java")]
    resources.srcDirs = [rootProject.file("versions/fabric-gametest/src/gametest/resources")]
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    xaeroBundle "maven.modrinth:xaeros-world-map:${target.xaeroFabric}"

    if (target.remappedFabric) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        modImplementation "com.terraformersmc:modmenu:${target.modMenu}"
        modImplementation "maven.modrinth:xaeros-world-map:${target.xaeroFabric}"
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        implementation "com.terraformersmc:modmenu:${target.modMenu}"
        implementation "maven.modrinth:xaeros-world-map:${target.xaeroFabric}"
    }
}

if (target.remappedFabric) {
    // Loom remaps the 1.21.11 outer Xaero JAR but does not expose its
    // embedded XaeroLib JAR to the named development runtime. Extract the
    // immutable nested artifact before Loom resolves modRuntimeOnly so Loom
    // can remap XaeroLib along with the outer mod.
    def xaeroBundleFile = configurations.xaeroBundle.singleFile
    def xaeroLibDirectory = rootProject.file(
        ".gradle/xaero-nested/${target.minecraft}/${target.xaeroFabric}"
    )
    def xaeroLibFile = new File(xaeroLibDirectory, "xaerolib.jar")

    new java.util.zip.ZipFile(xaeroBundleFile).withCloseable { archive ->
        def matches = java.util.Collections.list(archive.entries()).findAll {
            !it.directory && it.name ==~ /META-INF\/jars\/xaerolib-.*\.jar/
        }
        if (matches.size() != 1) {
            throw new GradleException(
                "Expected exactly one embedded XaeroLib JAR in ${xaeroBundleFile.name}, " +
                "found ${matches.size()}"
            )
        }

        def nestedEntry = matches[0]
        if (!xaeroLibFile.isFile() || xaeroLibFile.length() != nestedEntry.size) {
            xaeroLibDirectory.mkdirs()
            def temporaryFile = new File(xaeroLibDirectory, "xaerolib.jar.tmp")
            archive.getInputStream(nestedEntry).withCloseable { input ->
                temporaryFile.withOutputStream { output -> input.transferTo(output) }
            }
            java.nio.file.Files.move(
                temporaryFile.toPath(),
                xaeroLibFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
    }

    dependencies {
        // XaeroLib must be on the remap/compile classpath, not just runtime:
        // GuiMap inherits Minecraft members through XaeroLib's ScreenBase.
        modImplementation files(xaeroLibFile)
    }
}

def resourceProperties = [
    version            : project.version,
    minecraftRange     : target.minecraftRange,
    javaVersion        : target.javaVersion,
    mixinJava          : target.mixinJava
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching("fabric.mod.json") { expand(resourceProperties) }
    filesMatching("xaero-world-map-bridge.mixins.json") { expand(resourceProperties) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = target.javaVersion
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(target.javaVersion)
    sourceCompatibility = JavaVersion.toVersion(target.javaVersion)
    targetCompatibility = JavaVersion.toVersion(target.javaVersion)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
